name: Release integrity (offline)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check reviewed file and source identities
        run: python3 scripts/verify_release.py
